<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Force - Admissions File/Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-air-force">
    <main class="page-card air-force-card">
        <div class="air-force-header">
            <img src="air-force-logo.png" alt="U.S. Air Force emblem">
        </div>
        <h1 class="air-force-title">Admissions File/Application</h1>
        <p>Your admissions file includes academic records, recommendations, essays, and required materials submitted for official review.</p>
        <p><a class="air-force-login-link" href="https://usafacrm.experience.crmforce.mil/usafacademy/s/login/">Login</a></p>
        <p>Complete the Pre-Candidate Questionnaire (PCQ) first to access the application.</p>
        <button class="air-force-check-btn" type="button" data-key="air-force-admissions-file-application" aria-label="Mark admissions file complete">✓ Completed</button>
        <a class="back-link" href="air-force.html">Back to Air Force list</a>
    </main>
    <script>
        const checkButton = document.querySelector('.air-force-check-btn');
        if (checkButton) {
            const key = checkButton.dataset.key;
            if (localStorage.getItem(key) === 'true') {
                checkButton.classList.add('checked');
            }

            checkButton.addEventListener('click', () => {
                const isChecked = checkButton.classList.toggle('checked');
                localStorage.setItem(key, String(isChecked));
            });
        }
    </script>
</body>
</html>
