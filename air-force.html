<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Force Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-air-force">
    <main class="page-card air-force-card">
        <div class="air-force-header">
            <img src="air-force-logo.png" alt="U.S. Air Force emblem">
        </div>

        <h1 class="air-force-title">U.S. AIR FORCE</h1>
        <p>Welcome to the Air Force Academy page.</p>

        <div class="option-list">
            <button class="option-btn" type="button">Basic Eligibility</button>
            <button class="option-btn" type="button">SAT/ACT</button>
            <button class="option-btn" type="button">Pre-Candidate Questionnaire</button>
            <button class="option-btn" type="button">Nominations</button>
            <button class="option-btn" type="button">Candidate Fitness Assessment (CFA)</button>
            <button class="option-btn" type="button">Admissions File/Application</button>
            <button class="option-btn" type="button">Medical Exams</button>
            <button class="option-btn" type="button">Interview</button>
            <button class="option-btn" type="button">Final Deadline</button>
        </div>

        <a class="back-link" href="index.html">Back to Academy Options</a>
    </main>

    <script>
        const airForcePages = {
            'Basic Eligibility': 'air-force-basic-eligibility.html',
            'SAT/ACT': 'air-force-sat-act.html',
            'Pre-Candidate Questionnaire': 'air-force-pre-candidate-questionnaire.html',
            'Nominations': 'air-force-nominations.html',
            'Candidate Fitness Assessment (CFA)': 'air-force-candidate-fitness-assessment.html',
            'Admissions File/Application': 'air-force-admissions-file-application.html',
            'Medical Exams': 'air-force-medical-exams.html',
            'Interview': 'air-force-interview.html',
            'Final Deadline': 'air-force-final-deadline.html'
        };

        const airForceButtonKeys = {
            'Basic Eligibility': 'air-force-basic-eligibility',
            'SAT/ACT': 'air-force-sat-act',
            'Pre-Candidate Questionnaire': 'air-force-pre-candidate-questionnaire',
            'Nominations': 'air-force-nominations',
            'Candidate Fitness Assessment (CFA)': 'air-force-candidate-fitness-assessment',
            'Admissions File/Application': 'air-force-admissions-file-application',
            'Medical Exams': 'air-force-medical-exams',
            'Interview': 'air-force-interview',
            'Final Deadline': 'air-force-final-deadline'
        };

        document.querySelectorAll('.option-btn').forEach((button) => {
            const label = button.textContent.trim();
            const key = airForceButtonKeys[label];
            const page = airForcePages[label];

            if (key && localStorage.getItem(key) === 'true') {
                button.classList.add('completed');
            }

            if (page) {
                button.addEventListener('click', () => {
                    window.location.href = page;
                });
            }
        });
    </script>
</body>
</html>
