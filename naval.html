<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naval Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-navy">
    <main class="page-card navy-card">
        <div class="navy-header">
            <img src="navy-logo.png" alt="U.S. Navy emblem">
        </div>

        <h1 class="navy-title">U.S. NAVY</h1>
        <p>Welcome to the Naval Academy page.</p>

        <div class="option-list">
            <button class="option-btn" type="button">1</button>
            <button class="option-btn" type="button">2</button>
            <button class="option-btn" type="button">3</button>
            <button class="option-btn" type="button">4</button>
            <button class="option-btn" type="button">5</button>
        </div>

        <a class="back-link" href="index.html">Back to Academy Options</a>
    </main>

    <script>
        document.querySelectorAll('.option-btn').forEach((button) => {
            button.addEventListener('click', () => {
                alert(`Option ${button.textContent} selected`);
            });
        });
    </script>
</body>
</html>
