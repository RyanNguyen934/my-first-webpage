<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Marine - SAT/ACT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-merchant">
    <main class="page-card merchant-card">
        <div class="merchant-header">
            <img src="https://www.usmma.edu/themes/custom/usmma/images/logo.svg" alt="United States Merchant Marine Academy wordmark logo">
        </div>
        <h1 class="merchant-title">SAT/ACT</h1>
        <p>Strong SAT or ACT scores can strengthen a Merchant Marine Academy application and demonstrate academic readiness.</p>
        <button class="air-force-check-btn" type="button" data-key="merchant-sat-act" aria-label="Mark SAT/ACT complete">✓ Completed</button>
        <a class="back-link" href="merchant-marine.html">Back to Merchant Marine list</a>
    </main>
    <script>
        const checkButton = document.querySelector('.air-force-check-btn');
        if (checkButton) {
            const key = checkButton.dataset.key;
            if (localStorage.getItem(key) === 'true') {
                checkButton.classList.add('checked');
            }

            checkButton.addEventListener('click', () => {
                const isChecked = checkButton.classList.toggle('checked');
                localStorage.setItem(key, String(isChecked));
            });
        }
    </script>
</body>
</html>
