<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Army Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-army">
    <main class="page-card army-card">
        <div class="army-header">
            <img src="us-army-logo-png.jpg" alt="U.S. Army emblem">
        </div>

        <h1 class="army-title">U.S. ARMY</h1>
        <p>Welcome to the Army Academy page.</p>

        <div class="option-list">
            <button class="option-btn" type="button">1</button>
            <button class="option-btn" type="button">2</button>
            <button class="option-btn" type="button">3</button>
            <button class="option-btn" type="button">4</button>
            <button class="option-btn" type="button">5</button>
        </div>

        <a class="back-link" href="index.html">Back to Academy Options</a>
    </main>

    <script>
        document.querySelectorAll('.option-btn').forEach((button) => {
            button.addEventListener('click', () => {
                alert(`Option ${button.textContent} selected`);
            });
        });
    </script>
</body>
</html>
