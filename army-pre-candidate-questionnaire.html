<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Army - Pre-Candidate Questionnaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-army">
    <main class="page-card army-card">
        <div class="army-header">
            <img src="us-army-logo-png.jpg" alt="U.S. Army emblem">
        </div>
        <h1 class="army-title">Pre-Candidate Questionnaire</h1>
        <p>This questionnaire helps assess a candidate’s background, interests, and readiness before moving further in the application process.</p>
        <button class="air-force-check-btn" type="button" data-key="army-pre-candidate-questionnaire" aria-label="Mark pre-candidate questionnaire complete">✓ Completed</button>
        <a class="back-link" href="army.html">Back to Army list</a>
    </main>
    <script>
        const checkButton = document.querySelector('.air-force-check-btn');
        if (checkButton) {
            const key = checkButton.dataset.key;
            if (localStorage.getItem(key) === 'true') {
                checkButton.classList.add('checked');
            }

            checkButton.addEventListener('click', () => {
                const isChecked = checkButton.classList.toggle('checked');
                localStorage.setItem(key, String(isChecked));
            });
        }
    </script>
</body>
</html>
