<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navy - Candidate Fitness Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body page-navy">
    <main class="page-card navy-card">
        <div class="navy-header">
            <img src="navy-logo.png" alt="U.S. Navy emblem">
        </div>
        <h1 class="navy-title">Candidate Fitness Assessment (CFA)</h1>
        <p>The CFA measures physical readiness and helps determine whether an applicant meets the required standards for Academy participation.</p>
        <button class="air-force-check-btn" type="button" data-key="navy-candidate-fitness-assessment" aria-label="Mark CFA complete">✓ Completed</button>
        <a class="back-link" href="naval.html">Back to Navy list</a>
    </main>
    <script>
        const checkButton = document.querySelector('.air-force-check-btn');
        if (checkButton) {
            const key = checkButton.dataset.key;
            if (localStorage.getItem(key) === 'true') {
                checkButton.classList.add('checked');
            }

            checkButton.addEventListener('click', () => {
                const isChecked = checkButton.classList.toggle('checked');
                localStorage.setItem(key, String(isChecked));
            });
        }
    </script>
</body>
</html>
